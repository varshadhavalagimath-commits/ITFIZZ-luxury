
name: Deploy ITFIZZ to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: itz-fizz/package-lock.json

      - name: Install dependencies
        working-directory: itz-fizz
        run: npm ci

      - name: Build website
        working-directory: itz-fizz
        run: npm run build

      - name: Add SPA fallback
        working-directory: itz-fizz
        run: cp dist/index.html dist/404.html

      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: itz-fizz/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
